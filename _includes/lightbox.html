<div class="lightbox" id="lightbox" hidden aria-hidden="true" style="display: none;">
  <div class="lightbox-backdrop" data-lightbox-close></div>
  <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Project image viewer">
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Back to project">Back to project</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous image">Prev</button>
    <figure class="lightbox-figure">
      <img class="lightbox-image" src="" alt="">
      <figcaption class="lightbox-caption">
        <p class="lightbox-title"></p>
        <p class="lightbox-blurb"></p>
      </figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next image">Next</button>
    <p class="lightbox-counter" aria-live="polite"></p>
  </div>
</div>
